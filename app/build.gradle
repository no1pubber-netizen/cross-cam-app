plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.mikewall.crosscam'
    compileSdk 34

    defaultConfig {
        applicationId 'uk.mikewall.crosscam'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '0.7'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        // Fixed debug key kept in the repo so each new build installs over the last one.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.5.1'
}
